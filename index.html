<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline Alkitab — Adam sampai Yesus</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d4a854;--gold-light:#f0d78c;--bg:#0a0a0f;--card-bg:rgba(255,255,255,0.025);--card-border:rgba(255,255,255,0.06);--text:#e8e6e3;--text-dim:#8a8a9a;--text-muted:#6a6a7a}

html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;height:100vh}

/* ═══════ HEADER ═══════ */
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--card-border);padding:14px 24px}
.header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.header h1{font-family:'Playfair Display',serif;font-size:1.2rem;background:linear-gradient(135deg,var(--gold-light),var(--gold));background-clip:text;-webkit-background-clip:text;color:transparent;white-space:nowrap}
.header h1 span{font-size:0.7rem;color:var(--text-muted);background:none;-webkit-background-clip:unset;background-clip:unset;font-family:'Inter',sans-serif;font-weight:300;display:none}
.header-nav{display:flex;gap:4px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.header-nav::-webkit-scrollbar{display:none}

.era-btn{flex-shrink:0;padding:5px 12px;border-radius:6px;border:1px solid var(--card-border);background:transparent;color:var(--text-dim);font-size:0.7rem;font-weight:500;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.era-btn:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.era-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}

/* ═══════ VIEWPORT ═══════ */
.viewport{position:fixed;top:102px;left:0;right:0;bottom:0;overflow-x:auto;overflow-y:hidden;padding:0}
.viewport::-webkit-scrollbar{height:6px}
.viewport::-webkit-scrollbar-track{background:transparent}
.viewport::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:3px}

/* ═══════ TRACK (the horizontal scrollable strip) ═══════ */
.track{display:flex;align-items:stretch;height:100%;padding:20px 60px;gap:0;position:relative}

/* Timeline line */
.track::before{content:'';position:absolute;top:55%;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 2%,rgba(var(--gold),0.15) 5%,rgba(var(--gold),0.15) 95%,transparent);z-index:0}

/* Dotted progress dot */
.progress-dot{position:fixed;top:50%;left:50%;width:18px;height:18px;background:var(--gold);border-radius:50%;transform:translate(-50%,-50%);z-index:5;border:3px solid var(--bg);pointer-events:none;box-shadow:0 0 20px rgba(212,168,84,0.3);display:none}

/* ═══════ ERA COLUMN ═══════ */
.era-col{display:flex;flex-direction:column;flex-shrink:0;position:relative;padding:0 4px;min-height:100%}
.era-col:first-child{padding-left:0}
.era-col:last-child{padding-right:0}

/* Era header label */
.era-header{text-align:center;padding:8px 0;margin-bottom:8px;position:sticky;top:0;z-index:10}
.era-header .era-name{font-family:'Playfair Display',serif;font-size:0.85rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;display:block}
.era-header .era-years{font-size:0.6rem;color:var(--text-muted);font-weight:300;margin-top:1px;display:block}

/* Era horizontal divider */
.era-divider{height:2px;margin:0 8px 12px;border-radius:1px;opacity:0.6}

/* ═══════ EVENT CARDS CONTAINER (stacked vertically within era column) ═══════ */
.events-stack{display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;padding:0 4px 20px;scrollbar-width:thin}
.events-stack::-webkit-scrollbar{width:3px}
.events-stack::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:2px}

/* ═══════ EVENT CARD ═══════ */
.event-card{flex-shrink:0;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all 0.25s;position:relative;min-width:160px;max-width:180px}
.event-card::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--era-color,#d4a854);border:2px solid var(--bg);z-index:2;transition:all 0.3s}
.event-card:hover{background:rgba(255,255,255,0.06);border-color:var(--era-color,#d4a854);transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,0.3)}
.event-card:hover::before{box-shadow:0 0 16px var(--era-color,#d4a854);transform:translateX(-50%) scale(1.25)}

.event-card .date{font-family:'JetBrains Mono',monospace;font-size:0.6rem;font-weight:500;color:var(--era-color,#d4a854);margin-bottom:3px}
.event-card .title{font-size:0.78rem;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:2px}
.event-card .sub{font-size:0.62rem;color:var(--text-muted);line-height:1.4}

/* Scroll indicator arrows */
.scroll-arrow{display:none;position:fixed;top:55%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(212,168,84,0.1);border:1px solid rgba(212,168,84,0.2);color:var(--gold);font-size:1.2rem;cursor:pointer;z-index:50;transition:all 0.2s;align-items:center;justify-content:center}
.scroll-arrow:hover{background:rgba(212,168,84,0.2)}
.scroll-arrow.left{left:10px;display:flex}
.scroll-arrow.right{right:10px;display:flex}

/* ═══════ MODAL ═══════ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:200;justify-content:center;align-items:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#14141e;border:1px solid var(--card-border);border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;padding:28px;position:relative;animation:modalIn 0.3s ease}
@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer;transition:color 0.2s;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-era{font-size:0.65rem;font-weight:500;letter-spacing:1px;color:var(--era-color,#d4a854);text-transform:uppercase;margin-bottom:4px}
.modal-date{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--text-dim);margin-bottom:8px}
.modal-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.25}
.modal-sub{font-size:0.85rem;color:var(--text-dim);margin-bottom:12px;font-weight:300}
.modal-desc{font-size:0.85rem;color:var(--text);line-height:1.7;margin-bottom:12px}
.modal-ref{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--text-muted);padding:6px 10px;background:rgba(255,255,255,0.03);border-radius:6px;display:inline-block}
.modal-chapter-link{display:inline-block;margin-left:6px;color:var(--gold);font-size:0.7rem;text-decoration:none;font-family:'JetBrains Mono',monospace}
.modal-chapter-link:hover{text-decoration:underline}

/* ═══════ RESPONSIVE ═══════ */
@media(max-width:768px){
  .header{padding:10px 14px}
  .header h1{font-size:1rem}
  .era-btn{padding:4px 10px;font-size:0.65rem}
  .viewport{top:96px}
  .track{padding:10px 20px}
  .event-card{min-width:130px;max-width:150px;padding:8px 10px}
  .event-card .title{font-size:0.7rem}
  .scroll-arrow{display:none!important}
}

/* ═══════ COLOR THEMES ═══════ */
.era-1{--era-color:#d4a854}
.era-2{--era-color:#6ad4a0}
.era-3{--era-color:#4a9eff}
.era-4{--era-color:#d48a7a}
.era-5{--era-color:#d4a854}
.era-6{--era-color:#c06050}
.era-7{--era-color:#7ab8d4}
.era-8{--era-color:#8a6ad4}
.era-9{--era-color:#f0d78c}
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<div class="header">
  <div class="header-top">
    <h1>✦ Adam → Yesus <span>Timeline Alkitab</span></h1>
    <div class="header-nav" id="eraNav"></div>

<div class="viewport" id="viewport">

      {date:"~ 5 SM", title:"Yohanes Pembaptis", sub:"'Elia' yang dijanjikan", desc:"Zakharia & Elisabet — mandul melahirkan. Yohanes: suara yang berseru di padang gurun.", ref:"Lukas 1"},
      {date:"~ 4 SM", title:"✧ YESUS LAHIR", sub:"Firman menjadi manusia", desc:"Betlehem, palungan, gembala, orang Majus. 'Hari ini telah lahir Juruselamat.'", ref:"Matius 1-2; Lukas 2"},
      {date:"~ AD 26", title:"Yesus Dibaptis", sub:"'Inilah Anak-Ku yang Kukasihi'", desc:"Baptis di Yordan. Roh Kudus sebagai merpati. Suara Bapa. Iblis dicobai 40 hari.", ref:"Matius 3-4"},
      {date:"~ AD 27-30", title:"3 Tahun Pelayanan", sub:"Mengajar & mujizat", desc:"12 murid, Khotbah di Bukit, perumpamaan, 5.000 diberi makan, Lazarus dibangkitkan.", ref:"Matius 5-25"},
      {date:"~ AD 30", title:"Minggu Terakhir", sub:"Hosana → Salibkan Dia", desc:"Masuk Yerusalem di atas keledai. Perjamuan Terakhir. Getsemani. Yudas.", ref:"Matius 21-26"},
      {date:"~ AD 30", title:"✝ SALIB", sub:"'Sudah selesai'", desc:"Disalibkan Golgota. Gelap gulita. Tirai Bait Suci terbelah. Dikuburkan.", ref:"Matius 27; Yohanes 19"},
      {date:"~ AD 30", title:"✟ KEBANGKITAN", sub:"Kubur kosong!", desc:"'Ia tidak ada di sini — Ia telah bangkit!' Tomas: 'Tuhanku dan Allahku.' 500 saksi. Naik ke surga.", ref:"Matius 28; Yohanes 20-21"},
      {date:"~ AD 30", title:"Amanat Agung", sub:"Pergi, jadikan murid", desc:"'Kepada-Ku telah diberikan segala kuasa. Karena itu pergilah, jadikanlah semua bangsa murid-Ku.'", ref:"Matius 28:19-20"}
    ]
  }
];

// ═══════════════════════════════════════════════════
// BUILD
// ═══════════════════════════════════════════════════
const track = document.getElementById('track');
const eraNav = document.getElementById('eraNav');
const modalOverlay = document.getElementById('modalOverlay');
const viewport = document.getElementById('viewport');

// Era colors
const COLORS = [
  '#d4a854','#6ad4a0','#4a9eff','#d48a7a','#d4a854',
  '#c06050','#7ab8d4','#8a6ad4','#f0d78c'
];

DATA.forEach((era, ei) => {
  // Column
  const col = document.createElement('div');
  col.className = `era-col ${era.cls}`;
  col.dataset.era = era.id;

  // Width based on number of events
  const w = Math.max(180, era.events.length * 120);
  col.style.width = w + 'px';

  // Era header
  const hdr = document.createElement('div');
  hdr.className = 'era-header';
  hdr.innerHTML = `<span class="era-name" style="color:${COLORS[ei]}">${era.era.replace('ERA','')}</span><span class="era-years">${era.years}</span>`;
  col.appendChild(hdr);

  // Divider
  const div = document.createElement('div');
  div.className = 'era-divider';
  div.style.background = COLORS[ei];
  col.appendChild(div);

  // Events stack
  const stack = document.createElement('div');
  stack.className = 'events-stack';

  era.events.forEach((ev, vi) => {
    const card = document.createElement('div');
    card.className = 'event-card';
    card.style.setProperty('--era-color', COLORS[ei]);
    card.innerHTML = `<div class="date">${ev.date}</div><div class="title">${ev.title}</div><div class="sub">${ev.sub}</div>`;
    card.addEventListener('click', () => openModal(era, ev, ei));
    stack.appendChild(card);
  });

  col.appendChild(stack);
  track.appendChild(col);

  // Nav button
  const btn = document.createElement('button');
  btn.className = 'era-btn';
  btn.textContent = era.era.replace(/—.*/, '').trim();
  btn.dataset.era = era.id;
  btn.addEventListener('click', () => {
    col.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  });
  eraNav.appendChild(btn);
});

// ═══════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════
function openModal(era, ev, ei) {
  document.getElementById('modalEra').textContent = era.era;
  document.getElementById('modalDate').textContent = ev.date;
  document.getElementById('modalTitle').textContent = ev.title;
  document.getElementById('modalSub').textContent = ev.sub || '';
  document.getElementById('modalDesc').textContent = ev.desc;

  const refEl = document.getElementById('modalRef');
  refEl.innerHTML = '';
  const refSpan = document.createElement('span');
  refSpan.className = 'modal-ref';
  refSpan.textContent = '📖 ' + (ev.ref || '—');
  refEl.appendChild(refSpan);

  const m = document.getElementById('modal');
  m.style.setProperty('--era-color', COLORS[ei]);

  modalOverlay.classList.add('open');
}

document.getElementById('modalClose').addEventListener('click', () => modalOverlay.classList.remove('open'));
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) modalOverlay.classList.remove('open'); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') modalOverlay.classList.remove('open'); });

// ═══════════════════════════════════════════════════
// SCROLL ARROWS
// ═══════════════════════════════════════════════════
document.getElementById('scrollLeft').addEventListener('click', () => viewport.scrollBy({left:-300, behavior:'smooth'}));
document.getElementById('scrollRight').addEventListener('click', () => viewport.scrollBy({left:300, behavior:'smooth'}));

// Update active nav on scroll
viewport.addEventListener('scroll', () => {
  const cols = track.querySelectorAll('.era-col');
  let activeIdx = 0;
  cols.forEach((col, i) => {
    const rect = col.getBoundingClientRect();
    const center = rect.left + rect.width/2;
    if(center < window.innerWidth/2 + 100) activeIdx = i;
  });
  document.querySelectorAll('.era-btn').forEach((b, i) => {
    b.classList.toggle('active', i === activeIdx);
  });
});

// Trigger initial
viewport.dispatchEvent(new Event('scroll'));
</script>
</body>
</html>
